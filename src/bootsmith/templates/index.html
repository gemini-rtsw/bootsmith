<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bootsmith</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script>
    // Per-tab session id. Tabs share the cookie, so every request also
    // carries this id and each tab gets its own connection. It is kept in
    // sessionStorage only across a reload of this tab: it is taken out on
    // load and put back on pagehide, so a duplicated tab (which copies
    // sessionStorage) never finds it and makes its own.
    window.BS_TAB = (function () {
      let id = null;
      try {
        id = sessionStorage.getItem("bootsmith_tab");
        sessionStorage.removeItem("bootsmith_tab");
      } catch (_) {}
      if (!/^[A-Za-z0-9_-]{8,64}$/.test(id || "")) {
        const b = new Uint8Array(12);
        crypto.getRandomValues(b);  // randomUUID needs https; this doesn't
        id = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
      }
      window.addEventListener("pagehide", () => {
        try { sessionStorage.setItem("bootsmith_tab", id); } catch (_) {}
      });
      return id;
    })();
    document.addEventListener("htmx:configRequest", (evt) => {
      evt.detail.headers["X-Bootsmith-Tab"] = window.BS_TAB;
    });
    (function () {
      const origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        init = Object.assign({}, init);
        const headers = new Headers(init.headers || {});
        headers.set("X-Bootsmith-Tab", window.BS_TAB);
        init.headers = headers;
        return origFetch(input, init);
      };
    })();
  </script>
</head>
<body>
  <header>
    <h1>Bootsmith</h1>
    <p class="tagline">VME boot-parameter editor over WTI serial</p>
  </header>

  <div id="flash" role="alert" aria-live="assertive"></div>

  <main id="main">
    {% include "_profile_list.html" %}
  </main>

  <footer>
    <small>v0.1 &mdash; one connection per tab; a board can be open in only one tab at a time</small>
  </footer>

  <script>
    // Dumb terminal + lightweight status poller. The terminal is a
    // straight WebSocket <-> <pre> pipe; nothing else on the page
    // touches it. Driver work happens on the server via the existing
    // buttons (Push / Boot / Edit / Disconnect) and is independent.
    (function () {
      const STATE_LABEL = {
        idle: "idle",
        waiting: "waiting for prompt",
        aborting: "...",
        at_prompt: "AT PROMPT",
        missed: "no prompt detected",
      };

      let sse = null;
      let sseReconnectTimer = null;
      let sseShouldStayOpen = false;
      let pollTimer = null;
      let lastProfile = null;
      let paramsLoadedForLoader = null;

      function appendSerial(data) {
        const pre = document.getElementById("serial");
        if (!pre) return;
        let s = "";
        for (let i = 0; i < data.length; i++) {
          const c = data[i];
          if (c === 13) continue;
          if (c === 9 || c === 10 || (c >= 32 && c < 127)) {
            s += String.fromCharCode(c);
          } else {
            s += "\\x" + c.toString(16).padStart(2, "0");
          }
        }
        pre.appendChild(document.createTextNode(s));
        if (pre.textContent.length > 200000) {
          pre.textContent = pre.textContent.slice(-150000);
        }
        pre.scrollTop = pre.scrollHeight;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) & 0xff;
        return out;
      }

      function bytesToB64(bytes) {
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s);
      }

      function sendBytes(bytes) {
        let buf;
        if (typeof bytes === "string") {
          buf = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i) & 0xff;
        } else {
          buf = bytes;
        }
        const form = new FormData();
        form.append("b", bytesToB64(buf));
        fetch("/session/key", { method: "POST", body: form }).catch(() => {});
      }

      function openSSE() {
        try {
          sse = new EventSource("/session/stream?tab=" + encodeURIComponent(window.BS_TAB));
        } catch (e) {
          scheduleSSEReconnect();
          return;
        }
        sse.addEventListener("snapshot", (ev) => {
          try { appendSerial(b64ToBytes(ev.data)); } catch (_) {}
        });
        sse.addEventListener("chunk", (ev) => {
          try { appendSerial(b64ToBytes(ev.data)); } catch (_) {}
        });
        sse.addEventListener("closed", () => {
          if (sse) { try { sse.close(); } catch (_) {} sse = null; }
          if (sseShouldStayOpen) scheduleSSEReconnect();
        });
        sse.onerror = () => {
          if (sse) { try { sse.close(); } catch (_) {} sse = null; }
          if (sseShouldStayOpen) scheduleSSEReconnect();
        };
      }

      function scheduleSSEReconnect() {
        if (sseReconnectTimer || !sseShouldStayOpen) return;
        sseReconnectTimer = setTimeout(() => {
          sseReconnectTimer = null;
          if (sseShouldStayOpen) openSSE();
        }, 1000);
      }

      // Keydown handler — bound ONCE at document level. Only acts when
      // #terminal-input is the active element. Independent of any
      // htmx swap on #params or anywhere else.
      document.addEventListener("keydown", (e) => {
        const input = document.getElementById("terminal-input");
        if (!input || document.activeElement !== input) return;
        if (e.key === "Enter") {
          e.preventDefault(); sendBytes("\r"); input.value = ""; return;
        }
        if (e.key === "Backspace") {
          e.preventDefault(); sendBytes("\x7f"); input.value = input.value.slice(0, -1); return;
        }
        if (e.key === "Tab") { e.preventDefault(); sendBytes("\t"); return; }
        if (e.key === "Escape") { e.preventDefault(); sendBytes("\x1b"); return; }
        if (e.ctrlKey && e.key.length === 1) {
          const code = e.key.toUpperCase().charCodeAt(0);
          if (code >= 0x40 && code <= 0x5f) {
            e.preventDefault(); sendBytes(String.fromCharCode(code - 0x40)); return;
          }
        }
        if (e.key.length === 1 && !e.metaKey && !e.altKey) {
          e.preventDefault(); sendBytes(e.key); input.value += e.key; return;
        }
      });
      document.addEventListener("click", (e) => {
        if (e.target && e.target.id === "serial") {
          // Don't steal focus if the user just finished a text
          // selection -- stealing focus collapses the selection and
          // breaks copy from the serial pane.
          const sel = window.getSelection && window.getSelection();
          if (sel && sel.toString().length > 0) return;
          const inp = document.getElementById("terminal-input");
          if (inp) inp.focus();
        }
      });

      function applyStatus(j) {
        const stateEl = document.getElementById("status-state");
        const loaderEl = document.getElementById("status-loader");
        const aborts = document.getElementById("status-aborts");
        const bytes = document.getElementById("status-bytes");
        const banner = document.getElementById("status-banner");
        const reconnectForm = document.getElementById("reconnect-form");
        const paramsContainer = document.getElementById("params");
        if (!stateEl) return;
        if (!j.open) {
          stateEl.textContent = "closed";
          stateEl.className = "state-pill state-closed";
          return;
        }
        const transportDead = j.transport && j.transport.connected === false;
        if (transportDead) {
          stateEl.textContent = "WTI DROPPED — Reconnect";
          stateEl.className = "state-pill state-missed";
          if (reconnectForm) reconnectForm.style.display = "";
          if (banner && j.transport.error) {
            banner.textContent = "WTI closed the socket: " + j.transport.error;
            banner.classList.remove("hidden");
          }
          if (bytes) bytes.textContent = "in " + j.transport.bytes_in + "B / out " + j.transport.bytes_out + "B";
          return;
        }
        if (reconnectForm) reconnectForm.style.display = "none";
        stateEl.textContent = STATE_LABEL[j.state] || j.state;
        stateEl.className = "state-pill state-" + j.state;
        if (loaderEl) loaderEl.textContent = j.loader ? "loader: " + j.loader : "";
        if (aborts) aborts.textContent = j.abort_chars_sent ? "abort: " + j.abort_chars_sent + "B sent" : "";
        if (bytes && j.transport) bytes.textContent = "in " + j.transport.bytes_in + "B / out " + j.transport.bytes_out + "B";
        if (banner) {
          if (j.notes && j.notes.length) {
            banner.textContent = j.notes[j.notes.length - 1];
            banner.classList.remove("hidden");
          } else {
            banner.classList.add("hidden");
          }
        }
        if (paramsContainer && j.state === "at_prompt"
            && (j.loader === "vxworks" || j.loader === "ppcbug")) {
          if (paramsLoadedForLoader !== j.loader) {
            paramsLoadedForLoader = j.loader;
            paramsContainer.innerHTML = '<p class="hint">Loading saved params...</p>';
            fetch("/params").then(r => r.text()).then(html => {
              paramsContainer.innerHTML = html;
              if (window.htmx) {
                try { window.htmx.process(paramsContainer); } catch (_) {}
              }
            });
          }
        } else if (j.state !== "at_prompt") {
          paramsLoadedForLoader = null;
        }
      }

      async function poll() {
        try {
          const r = await fetch("/session/status");
          const j = await r.json();
          applyStatus(j);
        } catch (_) {}
      }

      function start(profile) {
        stop();
        lastProfile = profile;
        sseShouldStayOpen = true;
        openSSE();
        poll();
        pollTimer = setInterval(poll, 2000);
        const inp = document.getElementById("terminal-input");
        if (inp) inp.focus();
      }

      function stop() {
        sseShouldStayOpen = false;
        if (sseReconnectTimer) { clearTimeout(sseReconnectTimer); sseReconnectTimer = null; }
        if (sse) { try { sse.close(); } catch (_) {} sse = null; }
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        lastProfile = null;
        paramsLoadedForLoader = null;
      }

      function reconcile() {
        const section = document.querySelector(".session[data-profile]");
        if (section) {
          const p = section.getAttribute("data-profile");
          if (p !== lastProfile) start(p);
        } else {
          stop();
        }
      }

      document.addEventListener("DOMContentLoaded", reconcile);
      document.body.addEventListener("htmx:afterSwap", reconcile);
    })();

    // htmx does not swap 4xx/5xx responses, so without this a failed
    // request (e.g. Connect to a busy WTI port) shows nothing at all.
    // Put the server's error HTML in the #flash banner instead. Errors
    // come from _error(), which escapes the message.
    (function () {
      const flash = document.getElementById("flash");

      function show(html) {
        flash.innerHTML = html;
        flash.scrollIntoView({ block: "nearest" });
      }

      document.body.addEventListener("htmx:beforeRequest", () => {
        flash.innerHTML = "";
      });
      document.body.addEventListener("htmx:responseError", (evt) => {
        const xhr = evt.detail.xhr;
        const body = (xhr.responseText || "").trim();
        if (body.startsWith('<div class="error">')) {
          show(body);
        } else {
          const div = document.createElement("div");
          div.className = "error";
          div.textContent = `Request failed (HTTP ${xhr.status}).`;
          flash.replaceChildren(div);
        }
      });
      document.body.addEventListener("htmx:sendError", () => {
        const div = document.createElement("div");
        div.className = "error";
        div.textContent = "Could not reach the Bootsmith server.";
        flash.replaceChildren(div);
      });

      // Cancel on a connect in progress: tell the server to stop retrying
      // (that frees the port), then drop the browser's pending request.
      window.bsCancelConnect = function (btn) {
        const form = btn.closest("form");
        fetch("/session/cancel", { method: "POST", credentials: "same-origin" });
        htmx.trigger(form, "htmx:abort");
        const div = document.createElement("div");
        div.className = "error";
        div.textContent = "Connect cancelled.";
        flash.replaceChildren(div);
      };
    })();
  </script>
</body>
</html>
