name: Build and push container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes don't need a rebuild.
    paths-ignore:
      - "**/*.md"
      - "profiles/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The deploy targets are x86_64 VMs; skip the emulated arm64 build.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the manifest a plain single-arch image so older Docker
          # daemons on the deploy hosts pull it without surprises.
          provenance: false
